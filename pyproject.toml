[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "two-tor"
version = "0.1.0"
description = "A lightweight desktop English conversation companion"
requires-python = ">=3.11,<3.13"
dependencies = [
  "PySide6-Essentials==6.12.0",
  "moonshine-voice==0.1.5",
  "onnxruntime==1.31.0",
  "numpy>=2.2,<3", "sounddevice>=0.5,<0.6", "soundfile>=0.13,<0.15",
  "httpx>=0.28,<0.29", "python-dotenv>=1.2,<2", "psutil>=7,<8",
  "huggingface-hub>=1,<3", "espeakng-loader==0.2.4", "phonemizer==3.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12", "pyinstaller>=6,<7"]

[project.scripts]
2tor = "twotor.app:main"
2tor-benchmark = "twotor.benchmark:main"

[tool.setuptools.packages.find]
include = ["twotor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
